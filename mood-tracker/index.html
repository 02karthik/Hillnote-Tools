<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Mood Tracker</title>
  <style>
    :root {
      --bg: #000;
      --surface: #0d0d0d;
      --border: #1a1a1a;
      --text: #f0f0f0;
      --muted: #666;
      --accent: #ec4899;
      --accent-dim: rgba(236,72,153,0.15);
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px;
    }

    h1 {
      font-size: clamp(0.9rem, 3.5vw, 1.1rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .date-label {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-top: -16px;
    }

    .mood-prompt {
      font-size: clamp(0.85rem, 3vw, 0.95rem);
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* ── Mood picker ── */
    .mood-buttons {
      display: flex;
      gap: 10px;
    }

    .mood-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 10px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      min-width: 54px;
    }

    .mood-btn:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
      transform: translateY(-3px);
    }

    .mood-btn.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
      box-shadow: 0 0 18px var(--accent-dim);
      transform: translateY(-3px);
    }

    .mood-emoji { font-size: 1.7rem; }

    .mood-label {
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── History ── */
    .history-section {
      width: 100%;
      max-width: 380px;
    }

    .section-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 12px;
      text-align: center;
    }

    .history-grid {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .history-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .history-bubble {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .history-bubble.today {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-dim);
    }

    .history-day-label {
      font-size: 0.58rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── Stats ── */
    .stats {
      display: flex;
      gap: 36px;
      padding-top: 4px;
      border-top: 1px solid var(--border);
      width: 100%;
      max-width: 380px;
      justify-content: center;
    }

    .stat { text-align: center; }

    .stat-val {
      font-size: 1.6rem;
      font-weight: 300;
      color: var(--text);
    }

    .stat-label {
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: var(--surface);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 10px 24px;
      border-radius: 100px;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      transition: transform 0.3s ease;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <h1>Mood Tracker</h1>
  <div class="date-label" id="dateLabel"></div>

  <p class="mood-prompt">How are you feeling today?</p>

  <div class="mood-buttons" id="moodButtons"></div>

  <div class="history-section">
    <div class="section-title">Last 7 days</div>
    <div class="history-grid" id="historyGrid"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="streakVal">0</div>
      <div class="stat-label">day streak</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="topMoodVal">—</div>
      <div class="stat-label">top mood</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="totalVal">0</div>
      <div class="stat-label">logged</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const MOODS = [
      { emoji: '😞', label: 'rough',  value: 1 },
      { emoji: '😕', label: 'low',    value: 2 },
      { emoji: '😐', label: 'okay',   value: 3 },
      { emoji: '🙂', label: 'good',   value: 4 },
      { emoji: '😄', label: 'great',  value: 5 },
    ];

    const KEY = 'moodTrackerData';

    function isoToday() {
      const d = new Date();
      return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
    }

    function isoOffset(n) {
      const d = new Date();
      d.setDate(d.getDate() - n);
      return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
    }

    function p2(n) { return String(n).padStart(2, '0'); }

    function shortDay(iso) {
      return new Date(iso + 'T00:00:00')
        .toLocaleDateString('en-US', { weekday: 'short' }).slice(0, 2);
    }

    let data = {};
    try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}

    function persist() { localStorage.setItem(KEY, JSON.stringify(data)); }

    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    function renderMoodButtons() {
      const wrap = document.getElementById('moodButtons');
      wrap.innerHTML = '';
      const todayVal = data[isoToday()];
      MOODS.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'mood-btn' + (todayVal === m.value ? ' selected' : '');
        btn.innerHTML =
          `<span class="mood-emoji">${m.emoji}</span>` +
          `<span class="mood-label">${m.label}</span>`;
        btn.addEventListener('click', () => {
          data[isoToday()] = m.value;
          persist();
          renderMoodButtons();
          renderHistory();
          renderStats();
          showToast(`${m.emoji}  Mood saved`);
        });
        wrap.appendChild(btn);
      });
    }

    function renderHistory() {
      const grid = document.getElementById('historyGrid');
      grid.innerHTML = '';
      const today = isoToday();
      for (let i = 6; i >= 0; i--) {
        const iso = isoOffset(i);
        const val = data[iso];
        const mood = val ? MOODS.find(m => m.value === val) : null;
        const isToday = iso === today;

        const col = document.createElement('div');
        col.className = 'history-day';

        const bubble = document.createElement('div');
        bubble.className = 'history-bubble' + (isToday ? ' today' : '');
        bubble.textContent = mood ? mood.emoji : '·';

        const lbl = document.createElement('div');
        lbl.className = 'history-day-label';
        lbl.textContent = isToday ? 'today' : shortDay(iso);

        col.appendChild(bubble);
        col.appendChild(lbl);
        grid.appendChild(col);
      }
    }

    function renderStats() {
      let streak = 0;
      for (let i = 0; ; i++) {
        if (data[isoOffset(i)]) streak++;
        else break;
      }

      const total = Object.keys(data).length;

      const counts = {};
      Object.values(data).forEach(v => { counts[v] = (counts[v] || 0) + 1; });
      let topVal = null, topCount = 0;
      Object.entries(counts).forEach(([v, c]) => {
        if (c > topCount) { topCount = c; topVal = +v; }
      });
      const topMood = topVal ? MOODS.find(m => m.value === topVal) : null;

      document.getElementById('streakVal').textContent = streak;
      document.getElementById('topMoodVal').textContent = topMood ? topMood.emoji : '—';
      document.getElementById('totalVal').textContent = total;
    }

    // Date header
    document.getElementById('dateLabel').textContent = new Date().toLocaleDateString(
      'en-US', { weekday: 'long', month: 'long', day: 'numeric' }
    );

    renderMoodButtons();
    renderHistory();
    renderStats();
  </script>
</body>
</html>
