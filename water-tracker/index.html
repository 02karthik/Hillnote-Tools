<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef0f4">
<title>Water Tracker</title>
<style>
/* Palette + shapes follow the Hillnote design system: azure primary,
   cool-mist canvas, near-black ink, Manrope display + Inter body. */
:root {
  color-scheme: light dark;
  --bg: #eef0f4;
  --card: #ffffff;
  --border: #dfe3ec;
  --text: #111318;
  --body: #454852;
  --muted: #868a93;
  --accent: #4d63ff;
  --accent-dim: #e6ebff;
  --on-accent: #ffffff;
  --display: "Manrope", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --accent-text: #3b50e0;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161b;
    --card: #20242e;
    --border: #2f333d;
    --text: #eceff5;
    --body: #a9b0bf;
    --muted: #7d8494;
    --accent: #8b9bff;
    --accent-dim: #232842;
    --on-accent: #111318;
    --accent-text: #8b9bff;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-feature-settings: "calt";
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1.25rem 3rem;
}
header { text-align: center; }
.eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent-text);
  margin-bottom: 6px;
}
h1 {
  font-family: var(--display);
  font-size: clamp(1.9rem, 6vw, 2.6rem);
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin-bottom: 0.25rem;
}
.subtitle {
  color: var(--muted);
  font-size: 0.875rem;
  margin-bottom: 2.5rem;
}
.count-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 1.75rem;
}
.count {
  font-family: var(--display);
  font-size: 5.5rem;
  font-weight: 900;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  color: var(--accent-text);
  line-height: 1;
}
.goal-label {
  color: var(--muted);
  font-size: 1rem;
  margin-top: 0.25rem;
}
.glasses {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.5rem;
  width: 100%;
  max-width: 320px;
  margin-bottom: 1.5rem;
}
.glass {
  aspect-ratio: 1;
  border-radius: 0.875rem;
  border: 2px solid transparent;
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.625rem;
  transition: border-color 0.2s, background 0.2s;
}
.glass.filled {
  border-color: var(--accent);
  background: var(--accent-dim);
}
.progress-track {
  width: 100%;
  max-width: 320px;
  height: 8px;
  background: var(--card);
  border-radius: 4px;
  margin-bottom: 2rem;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 4px;
  transition: width 0.35s ease;
  width: 0%;
}
.done-msg {
  min-height: 1.5rem;
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--accent-text);
  margin-bottom: 1rem;
  text-align: center;
}
.btn-add {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 2.75rem;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.15s;
  margin-bottom: 1rem;
  flex-shrink: 0;
}
.btn-add:active { transform: scale(0.94); }
.btn-add:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-undo {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 0.5rem 1.75rem;
  border-radius: 999px;
  cursor: pointer;
  font-size: 0.875rem;
  margin-bottom: 2.5rem;
  transition: color 0.15s, border-color 0.15s;
}
.btn-undo:hover { color: var(--text); border-color: var(--muted); }
.btn-undo:disabled { opacity: 0.35; cursor: not-allowed; }
.settings {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  font-size: 0.875rem;
  color: var(--muted);
}
.settings input[type=number] {
  width: 3.25rem;
  padding: 0.25rem 0.375rem;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 0.5rem;
  font-size: 0.875rem;
  text-align: center;
}
.settings input[type=number]:focus {
  outline: none;
  border-color: var(--accent);
}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Health &middot; Hydration</div>
  <h1>Water Tracker</h1>
</header>
<p class="subtitle">Stay hydrated — one glass at a time</p>

<div class="count-wrap">
  <span class="count" id="count">0</span>
  <span class="goal-label" id="goalLabel">of 8 glasses today</span>
</div>

<div class="glasses" id="glasses"></div>

<div class="progress-track">
  <div class="progress-fill" id="progressFill"></div>
</div>

<p class="done-msg" id="doneMsg"></p>

<button class="btn-add" id="btnAdd" title="Log a glass of water">+</button>
<button class="btn-undo" id="btnUndo">↩ Remove last</button>

<div class="settings">
  <label for="goalInput">Daily goal:</label>
  <input type="number" id="goalInput" min="1" max="20" value="8">
  <span>glasses</span>
</div>

<script>
const STORAGE_KEY = 'hillnote-water-tracker';
const todayStr = () => new Date().toISOString().slice(0, 10);

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (!saved) return { date: todayStr(), count: 0, goal: 8 };
    // Reset count on new day, keep goal preference
    if (saved.date !== todayStr()) return { date: todayStr(), count: 0, goal: saved.goal ?? 8 };
    return saved;
  } catch {
    return { date: todayStr(), count: 0, goal: 8 };
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();

const countEl     = document.getElementById('count');
const goalLabelEl = document.getElementById('goalLabel');
const glassesEl   = document.getElementById('glasses');
const progressEl  = document.getElementById('progressFill');
const doneMsgEl   = document.getElementById('doneMsg');
const btnAdd      = document.getElementById('btnAdd');
const btnUndo     = document.getElementById('btnUndo');
const goalInput   = document.getElementById('goalInput');

function render() {
  const { count, goal } = state;

  countEl.textContent = count;
  goalLabelEl.textContent = `of ${goal} glass${goal === 1 ? '' : 'es'} today`;
  goalInput.value = goal;

  glassesEl.innerHTML = '';
  for (let i = 0; i < goal; i++) {
    const el = document.createElement('div');
    el.className = 'glass' + (i < count ? ' filled' : '');
    el.textContent = i < count ? '💧' : '🫙';
    glassesEl.appendChild(el);
  }

  const pct = goal > 0 ? Math.min(100, (count / goal) * 100) : 0;
  progressEl.style.width = pct + '%';

  const reached = count >= goal;
  btnAdd.disabled = reached;
  btnUndo.disabled = count === 0;
  doneMsgEl.textContent = reached ? '🎉 Goal reached! Great work!' : '';
}

btnAdd.addEventListener('click', () => {
  if (state.count < state.goal) {
    state.count++;
    saveState();
    render();
  }
});

btnUndo.addEventListener('click', () => {
  if (state.count > 0) {
    state.count--;
    saveState();
    render();
  }
});

goalInput.addEventListener('change', () => {
  const v = Math.max(1, Math.min(20, parseInt(goalInput.value) || 8));
  state.goal = v;
  if (state.count > state.goal) state.count = state.goal;
  saveState();
  render();
});

render();
</script>
</body>
</html>
