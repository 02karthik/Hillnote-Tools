name: Publish tool catalog

# Builds the signed catalog + deployable site and publishes it to GitHub Pages.
# Requires:
#   • repo Settings → Pages → Source = "GitHub Actions"
#   • repo secret CATALOG_SIGNING_KEY = contents of keys/ed25519-private.pem
on:
  push:
    branches: [main]
    paths:
      - 'tools.json'
      - 'index.html'
      - 'icon.svg'
      - 'screenshots/**'
      - 'scripts/**'
      - 'keys/public-key.json'
      - '*/index.html'
      - '.github/workflows/publish-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build & sign catalog
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          if [ -z "$CATALOG_SIGNING_KEY" ]; then
            echo "::error::CATALOG_SIGNING_KEY secret is not set"; exit 1
          fi
          # reproducible generatedAt: pin to the commit timestamp
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          node scripts/build-catalog.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
