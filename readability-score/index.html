<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Readability Score</title>
  <style>
    :root {
      --bg: #000;
      --surface: #0d0d0d;
      --border: #1a1a1a;
      --text: #f0f0f0;
      --muted: #666;
      --accent: #6366f1;
      --accent-dim: rgba(99,102,241,0.12);
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px;
      gap: 24px;
    }

    h1 {
      font-size: clamp(0.9rem, 3.5vw, 1.1rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .score-ring {
      position: relative;
      width: 140px;
      height: 140px;
    }

    .score-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: var(--border);
      stroke-width: 10;
    }

    .ring-fill {
      fill: none;
      stroke: var(--accent);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s ease, stroke 0.4s ease;
    }

    .score-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .score-num {
      font-size: 2.4rem;
      font-weight: 200;
      line-height: 1;
      color: var(--text);
    }

    .score-label {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    .level-badge {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 6px 18px;
      border-radius: 100px;
      background: var(--accent-dim);
      color: var(--accent);
      transition: background 0.4s, color 0.4s;
      min-height: 32px;
      display: flex;
      align-items: center;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 420px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
    }

    .stat-val {
      font-size: 1.6rem;
      font-weight: 300;
      color: var(--text);
      line-height: 1;
    }

    .stat-label {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
    }

    textarea {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      resize: vertical;
      min-height: 180px;
      line-height: 1.6;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); font-style: italic; }

    .clear-btn {
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 100px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 10px 28px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .clear-btn:hover { border-color: var(--muted); color: var(--text); }
    .clear-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <h1>📖 Readability Score</h1>

  <div class="score-ring">
    <svg viewBox="0 0 120 120">
      <circle class="ring-bg" cx="60" cy="60" r="55" />
      <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="55" />
    </svg>
    <div class="score-center">
      <div class="score-num" id="easeNum">—</div>
      <div class="score-label">Ease</div>
    </div>
  </div>

  <div class="level-badge" id="levelBadge">Paste text to analyse</div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-val" id="gradeNum">—</div>
      <div class="stat-label">Grade level</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="avgSentLen">—</div>
      <div class="stat-label">Words / sentence</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="avgSylWord">—</div>
      <div class="stat-label">Syllables / word</div>
    </div>
  </div>

  <textarea id="input" placeholder="Paste or type your text here…" autocomplete="off" spellcheck="true"></textarea>

  <button class="clear-btn" id="clearBtn">Clear</button>

  <script>
    const CIRC = 2 * Math.PI * 55;

    const ring      = document.getElementById('ringFill');
    const easeNum   = document.getElementById('easeNum');
    const badge     = document.getElementById('levelBadge');
    const gradeNum  = document.getElementById('gradeNum');
    const sentLen   = document.getElementById('avgSentLen');
    const sylWord   = document.getElementById('avgSylWord');

    ring.style.strokeDasharray  = CIRC;
    ring.style.strokeDashoffset = CIRC;

    function syllables(word) {
      word = word.toLowerCase().replace(/[^a-z]/g, '');
      if (!word) return 0;
      if (word.length <= 3) return 1;
      word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');
      word = word.replace(/^y/, '');
      const m = word.match(/[aeiouy]{1,2}/g);
      return m ? m.length : 1;
    }

    function levelFor(ease) {
      if (ease >= 90) return { label: 'Very Easy',        color: '#22c55e', dim: 'rgba(34,197,94,0.12)'    };
      if (ease >= 80) return { label: 'Easy',             color: '#84cc16', dim: 'rgba(132,204,22,0.12)'   };
      if (ease >= 70) return { label: 'Fairly Easy',      color: '#a3e635', dim: 'rgba(163,230,53,0.12)'   };
      if (ease >= 60) return { label: 'Standard',         color: '#6366f1', dim: 'rgba(99,102,241,0.12)'   };
      if (ease >= 50) return { label: 'Fairly Difficult', color: '#f59e0b', dim: 'rgba(245,158,11,0.12)'   };
      if (ease >= 30) return { label: 'Difficult',        color: '#f97316', dim: 'rgba(249,115,22,0.12)'   };
      return               { label: 'Very Difficult',   color: '#ef4444', dim: 'rgba(239,68,68,0.12)'    };
    }

    function analyse() {
      const text    = document.getElementById('input').value;
      const trimmed = text.trim();
      if (!trimmed) { reset(); return; }

      const words     = trimmed.split(/\s+/).filter(Boolean);
      const wordCount = words.length;
      if (wordCount < 2) { reset(); return; }

      const sentences = Math.max(1, trimmed.split(/[.!?]+/).filter(s => s.trim()).length);
      const syl       = words.reduce((s, w) => s + syllables(w), 0);

      const ease  = Math.min(100, Math.max(0,
        206.835 - 1.015 * (wordCount / sentences) - 84.6 * (syl / wordCount)
      ));
      const grade = Math.max(0,
        0.39 * (wordCount / sentences) + 11.8 * (syl / wordCount) - 15.59
      );

      const info = levelFor(ease);

      ring.style.strokeDashoffset = CIRC - (ease / 100) * CIRC;
      ring.style.stroke           = info.color;

      easeNum.textContent   = Math.round(ease);
      badge.textContent     = info.label;
      badge.style.color     = info.color;
      badge.style.background = info.dim;

      gradeNum.textContent = grade.toFixed(1);
      sentLen.textContent  = (wordCount / sentences).toFixed(1);
      sylWord.textContent  = (syl / wordCount).toFixed(2);
    }

    function reset() {
      ring.style.strokeDashoffset = CIRC;
      ring.style.stroke           = '#6366f1';
      easeNum.textContent   = '—';
      badge.textContent     = 'Paste text to analyse';
      badge.style.color     = '';
      badge.style.background = '';
      gradeNum.textContent = '—';
      sentLen.textContent  = '—';
      sylWord.textContent  = '—';
    }

    document.getElementById('input').addEventListener('input', analyse);
    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('input').value = '';
      reset();
      document.getElementById('input').focus();
    });
  </script>

</body>
</html>
