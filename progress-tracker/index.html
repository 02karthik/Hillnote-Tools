<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#eef0f4">
    <title>60 Months Progress</title>
    <style>
        /* Palette + shapes follow the Hillnote design system: azure primary,
           cool-mist canvas, near-black ink, Manrope display + Inter body. */
        :root {
            color-scheme: light dark;
            --primary: #4d63ff;
            --primary-active: #6f82ff;
            --primary-pale: #e6ebff;
            --primary-neutral: #b9c4ff;
            --on-primary: #ffffff;
            --ink: #111318;
            --body: #454852;
            --mute: #868a93;
            --canvas: #ffffff;
            --canvas-soft: #eef0f4;
            --line: #dfe3ec;
            --display: "Manrope", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --negative-deep: #b02a2a;
            --negative-pale: #fbe3e2;
            --negative-line: #f3c9c7;
            --negative-hover: #f8d3d1;
            --primary-text: #3b50e0;
        }

        @media (prefers-color-scheme: dark) {
          :root {
            --primary: #8b9bff;
            --primary-active: #a8b4ff;
            --primary-pale: #232842;
            --primary-neutral: #4d63ff;
            --on-primary: #111318;
            --ink: #eceff5;
            --body: #a9b0bf;
            --mute: #7d8494;
            --canvas: #20242e;
            --canvas-soft: #14161b;
            --line: #2f333d;
            --negative-deep: #ff9490;
            --negative-pale: #3a1412;
            --negative-line: #5c211f;
            --negative-hover: #4a1a18;
            --primary-text: #8b9bff;
          }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--sans);
            font-feature-settings: "calt";
            background: var(--canvas-soft);
            min-height: 100vh;
            display: flex;
            padding: 20px;
            color: var(--ink);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .container {
            background: var(--canvas);
            border-radius: 24px;
            padding: 32px;
            max-width: 700px;
            width: 100%;
            margin: auto;
            
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .year {
            font-family: var(--display);
            font-size: clamp(1.9rem, 6vw, 2.6rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1.05;
            color: var(--ink);
        }
        
        .header-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .days-left {
            font-size: 18px;
            font-weight: 600;
            color: var(--body);
        }
        
        .days-left strong {
            color: var(--primary-text);
        }
        
        #settingsBtn {
            background: var(--canvas);
            border: 1px solid var(--line);
            color: var(--ink);
            padding: 6px 12px;
            border-radius: 9999px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        
        #settingsBtn:hover {
            background: var(--canvas-soft);
            border-color: var(--ink);
        }
        
        .subtitle {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-text);
            margin-bottom: 24px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        
        .dots-container {
            display: grid;
            gap: 4px;
            margin-bottom: 24px;
            padding: 8px;
        }
        
        .dot {
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--canvas-soft);
            transition: background 0.2s ease;
        }
        
        .dot.elapsed {
            background: var(--primary-neutral);
        }
        
        .dot.today {
            background: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-neutral);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
        }
        
        .stat {
            text-align: center;
            padding: 12px;
            background: var(--canvas-soft);
            border-radius: 12px;
        }
        
        .stat-number {
            font-family: var(--display);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
            color: var(--ink);
        }
        
        .stat-number.green {
            color: var(--primary-text);
        }
        
        .stat-label {
            font-size: 10px;
            color: var(--mute);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .progress-bar {
            height: 6px;
            background: var(--canvas-soft);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 16px;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.5s ease;
        }
        
        .dates {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 11px;
            color: var(--mute);
        }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(17, 19, 24, 0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--canvas);
            border-radius: 24px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 18px 48px -18px rgba(17, 19, 24, 0.25);
        }
        
        .modal-header {
            font-family: var(--display);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            color: var(--ink);
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--body);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: var(--canvas);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--ink);
            font-size: 14px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-pale);
        }
        
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        
        .modal-buttons button {
            flex: 1;
            padding: 11px 16px;
            border-radius: 24px;
            border: none;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-save {
            background: var(--primary);
            color: var(--on-primary);
        }
        
        .btn-save:hover {
            background: var(--primary-active);
        }
        
        .btn-cancel {
            background: var(--canvas);
            color: var(--ink);
            border: 1px solid var(--line);
        }
        
        .btn-cancel:hover {
            border-color: var(--ink);
        }
        
        .btn-reset {
            background: var(--negative-pale);
            color: var(--negative-deep);
            border: 1px solid var(--negative-line);
            width: 100%;
            margin-top: 12px;
        }
        
        .btn-reset:hover {
            background: var(--negative-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="year" id="currentYear">2025</div>
            <div class="header-right">
                <div class="days-left"><strong id="daysLeftNum">0</strong> days left</div>
                <button id="settingsBtn">⚙️</button>
            </div>
        </div>
        <div class="subtitle" id="subtitle">60 months • Nov 3, 2025 → Nov 3, 2030</div>
        
        <div class="dots-container" id="dotsContainer"></div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="dates">
            <span id="startDateLabel">Start</span>
            <span id="percentLabel">0%</span>
            <span id="endDateLabel">End</span>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-number green" id="daysElapsed">0</div>
                <div class="stat-label">Days Elapsed</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="totalDays">0</div>
                <div class="stat-label">Total Days</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="monthsLeft">60</div>
                <div class="stat-label">Months Left</div>
            </div>
        </div>
    </div>
    
    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">Custom Dates</div>
            <form id="settingsForm">
                <div class="form-group">
                    <label for="startDateInput">Start Date</label>
                    <input type="date" id="startDateInput" required>
                </div>
                <div class="form-group">
                    <label for="endDateInput">End Date</label>
                    <input type="date" id="endDateInput" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="modal-buttons button btn-cancel" id="cancelBtn">Cancel</button>
                    <button type="submit" class="modal-buttons button btn-save">Save</button>
                </div>
                <button type="button" class="btn-reset" id="resetBtn">Reset to Default</button>
            </form>
        </div>
    </div>
    
    <script>
        // Default dates
        const DEFAULT_START = new Date(2025, 10, 3); // Nov 3, 2025
        const DEFAULT_END = new Date(2030, 10, 3);   // Nov 3, 2030
        
        let START_DATE = DEFAULT_START;
        let END_DATE = DEFAULT_END;
        
        // Load custom dates from localStorage
        function loadCustomDates() {
            const stored = localStorage.getItem('progressTrackerDates');
            if (stored) {
                try {
                    const { start, end } = JSON.parse(stored);
                    START_DATE = new Date(start);
                    END_DATE = new Date(end);
                } catch (e) {
                    console.log('Could not parse stored dates, using defaults');
                }
            }
        }
        
        // Save custom dates to localStorage
        function saveCustomDates(startDate, endDate) {
            localStorage.setItem('progressTrackerDates', JSON.stringify({
                start: startDate.toISOString(),
                end: endDate.toISOString()
            }));
            START_DATE = startDate;
            END_DATE = endDate;
            render();
        }
        
        // Reset to defaults
        function resetToDefaults() {
            localStorage.removeItem('progressTrackerDates');
            START_DATE = DEFAULT_START;
            END_DATE = DEFAULT_END;
            render();
            closeModal();
        }
        
        function daysBetween(d1, d2) {
            const msPerDay = 1000 * 60 * 60 * 24;
            return Math.floor((d2 - d1) / msPerDay);
        }
        
        function formatDate(date) {
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }
        
        function formatDateForInput(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        
        function monthsBetween(d1, d2) {
            let months = (d2.getFullYear() - d1.getFullYear()) * 12;
            months += d2.getMonth() - d1.getMonth();
            if (d2.getDate() < d1.getDate()) months--;
            return Math.max(0, months);
        }
        
        function render() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const totalDays = daysBetween(START_DATE, END_DATE);
            const elapsedDays = Math.max(0, Math.min(totalDays, daysBetween(START_DATE, today)));
            const daysLeft = totalDays - elapsedDays;
            const monthsLeft = monthsBetween(today, END_DATE);
            const percent = totalDays > 0 ? ((elapsedDays / totalDays) * 100).toFixed(1) : 0;
            
            // Update header
            document.getElementById('currentYear').textContent = today.getFullYear();
            document.getElementById('daysLeftNum').textContent = daysLeft.toLocaleString();
            document.getElementById('subtitle').textContent = 
                `${totalDays} days • ${formatDate(START_DATE)} → ${formatDate(END_DATE)}`;
            
            // Update stats
            document.getElementById('daysElapsed').textContent = elapsedDays.toLocaleString();
            document.getElementById('totalDays').textContent = totalDays.toLocaleString();
            document.getElementById('monthsLeft').textContent = monthsLeft;
            
            // Update progress
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('percentLabel').textContent = percent + '%';
            document.getElementById('startDateLabel').textContent = formatDate(START_DATE);
            document.getElementById('endDateLabel').textContent = formatDate(END_DATE);
            
            // Render dots grid
            const container = document.getElementById('dotsContainer');
            container.innerHTML = '';
            
            // Calculate grid dimensions
            const cols = 35;
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            
            for (let i = 0; i < totalDays; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (i < elapsedDays) {
                    dot.className = 'dot elapsed';
                } else if (i === elapsedDays) {
                    dot.className = 'dot today';
                }
                
                // Tooltip showing date
                const dotDate = new Date(START_DATE);
                dotDate.setDate(dotDate.getDate() + i);
                dot.title = formatDate(dotDate);
                
                container.appendChild(dot);
            }
        }
        
        function openModal() {
            document.getElementById('startDateInput').value = formatDateForInput(START_DATE);
            document.getElementById('endDateInput').value = formatDateForInput(END_DATE);
            document.getElementById('settingsModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('settingsModal').classList.remove('active');
        }
        
        // Event listeners
        document.getElementById('settingsBtn').addEventListener('click', openModal);
        document.getElementById('cancelBtn').addEventListener('click', closeModal);
        document.getElementById('settingsModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('settingsModal')) closeModal();
        });
        
        document.getElementById('settingsForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const startDate = new Date(document.getElementById('startDateInput').value);
            const endDate = new Date(document.getElementById('endDateInput').value);
            
            if (startDate < endDate) {
                saveCustomDates(startDate, endDate);
                closeModal();
            } else {
                alert('Start date must be before end date');
            }
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('Reset to default dates?')) {
                resetToDefaults();
            }
        });
        
        // Initialize
        loadCustomDates();
        render();
        setInterval(render, 60 * 60 * 1000);
        
        // Disable pinch-zoom (but allow scrolling)
        document.addEventListener('gesturestart', (e) => e.preventDefault());

        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
