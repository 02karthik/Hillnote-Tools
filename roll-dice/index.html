<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef0f4">
    <title>Roll a Dice</title>
    <style>
        /* Palette + shapes follow the Hillnote design system: azure primary,
           cool-mist canvas, near-black ink, Manrope display + Inter body. */
        :root {
            color-scheme: light dark;
            --primary: #4d63ff;
            --primary-active: #6f82ff;
            --primary-pale: #e6ebff;
            --on-primary: #ffffff;
            --ink: #111318;
            --mute: #868a93;
            --canvas: #ffffff;
            --canvas-soft: #eef0f4;
            --line: #dfe3ec;
            --display: "Manrope", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --primary-text: #3b50e0;
        }

        @media (prefers-color-scheme: dark) {
          :root {
            --primary: #8b9bff;
            --primary-active: #a8b4ff;
            --primary-pale: #232842;
            --on-primary: #111318;
            --ink: #eceff5;
            --mute: #7d8494;
            --canvas: #20242e;
            --canvas-soft: #14161b;
            --line: #2f333d;
            --primary-text: #8b9bff;
          }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--sans);
            font-feature-settings: "calt";
            background: var(--canvas-soft);
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--canvas);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .eyebrow {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--primary-text);
            margin-bottom: 6px;
        }

        h1 {
            font-family: var(--display);
            font-size: clamp(1.9rem, 6vw, 2.6rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1.05;
            color: var(--ink);
            margin-bottom: 30px;
        }

        .dice-display {
            width: 150px;
            height: 150px;
            background: var(--canvas-soft);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            font-family: var(--display);
            font-size: 5em;
            color: var(--ink);
            font-weight: 900;
            letter-spacing: -0.03em;
            font-variant-numeric: tabular-nums;
            transition: transform 0.3s ease;
        }

        .dice-display.rolling {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-5deg) scale(1.05); }
            50% { transform: rotate(5deg) scale(1.05); }
            75% { transform: rotate(-5deg) scale(1.05); }
        }

        button {
            background: var(--primary);
            color: var(--on-primary);
            border: none;
            padding: 14px 40px;
            font-family: inherit;
            font-size: 1rem;
            border-radius: 24px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            font-weight: 600;
            margin: 10px 5px;
        }

        button:hover {
            transform: translateY(-2px);
            background: var(--primary-active);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


    </style>
</head>
<body>
    <div class="container">
        <div class="eyebrow">Fun &middot; Chance</div>
        <h1>Roll a Dice</h1>
        <div class="dice-display" id="diceDisplay">-</div>
        <button id="rollBtn" onclick="rollDice()">Roll Dice</button>
        

    </div>

    <script>
        function rollDice() {
            const diceDisplay = document.getElementById('diceDisplay');
            const rollBtn = document.getElementById('rollBtn');
            
            rollBtn.disabled = true;
            diceDisplay.classList.add('rolling');

            // Simulate rolling animation
            let rolls = 0;
            const rollInterval = setInterval(() => {
                const randomNum = Math.floor(Math.random() * 6) + 1;
                diceDisplay.textContent = randomNum;
                rolls++;

                if (rolls >= 10) {
                    clearInterval(rollInterval);
                    const finalNumber = Math.floor(Math.random() * 6) + 1;
                    diceDisplay.textContent = finalNumber;
                    diceDisplay.classList.remove('rolling');
                    rollBtn.disabled = false;
                }
            }, 100);
        }
    </script>
</body>
</html>
