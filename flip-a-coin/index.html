<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#eef0f4" />
  <title>Flip a Coin</title>
  <style>
    :root {
      --bg: #eef0f4;
      --surface: #ffffff;
      --border: #dfe3ec;
      --text: #111318;
      --muted: #868a93;
      --accent: #4d63ff;
      --accent-dim: #e6ebff;
      --indigo: #38c9d6;
      --indigo-dim: #e2f7f9;
      --radius: 24px;
      --body: #454852;
      --on-accent: #f4f6ff;
      --display: "Manrope", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-feature-settings: "calt";
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 28px;
    }

    header { text-align: center; }
    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    h1 {
      font-family: var(--display);
      font-size: clamp(1.9rem, 6vw, 2.6rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--text);
    }

    /* ── 3-D coin ── */
    .coin-scene {
      perspective: 700px;
      width: 148px;
      height: 148px;
    }

    .coin {
      width: 148px;
      height: 148px;
      position: relative;
      transform-style: preserve-3d;
    }

    .coin-face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      background: radial-gradient(circle at 35% 35%, #fde68a, #d97706 80%);
      box-shadow:
        inset 0 2px 6px rgba(255,255,255,0.35),
        inset 0 -3px 8px rgba(0,0,0,0.45),
        0 0 0 5px #92400e,
        0 10px 40px rgba(234,179,8,0.28);
    }

    .coin-tails {
      transform: rotateY(180deg);
    }

    .face-label {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #78350f;
      text-shadow: 0 1px 2px rgba(255,255,255,0.3);
      user-select: none;
    }

    /* ── result text ── */
    .result {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      min-height: 2.2rem;
      color: var(--accent);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .result.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── stats ── */
    .stats {
      display: flex;
      gap: 32px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stat-val {
      font-family: var(--display);
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── history pills ── */
    .history {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 320px;
      min-height: 28px;
    }

    .pill {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .pill-H {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .pill-T {
      background: var(--indigo-dim);
      border: 1px solid var(--indigo);
      color: #0d6b73;
    }

    /* ── buttons ── */
    .flip-btn {
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: 100px;
      padding: 14px 52px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
    }

    .flip-btn:hover:not(:disabled) { opacity: 0.88; }
    .flip-btn:active:not(:disabled) { transform: scale(0.97); }
    .flip-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .reset-btn {
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 100px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 9px 28px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .reset-btn:hover { border-color: var(--muted); color: var(--text); }
    .reset-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <header>
    <div class="eyebrow">Fun &middot; Chance</div>
    <h1>Flip a Coin</h1>
  </header>

  <div class="coin-scene">
    <div class="coin" id="coin">
      <div class="coin-face coin-heads"><span class="face-label">H</span></div>
      <div class="coin-face coin-tails"><span class="face-label">T</span></div>
    </div>
  </div>

  <div class="result" id="result">–</div>

  <div class="stats">
    <div class="stat">
      <span class="stat-val" id="headsCount">0</span>
      <span class="stat-label">Heads</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="flipsCount">0</span>
      <span class="stat-label">Flips</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="tailsCount">0</span>
      <span class="stat-label">Tails</span>
    </div>
  </div>

  <div class="history" id="history"></div>

  <button class="flip-btn" id="flipBtn">Flip</button>
  <button class="reset-btn" id="resetBtn">Reset</button>

  <script>
    let heads = 0, tails = 0, busy = false, rotation = 0;

    const coin     = document.getElementById('coin');
    const resultEl = document.getElementById('result');
    const flipBtn  = document.getElementById('flipBtn');
    const resetBtn = document.getElementById('resetBtn');
    const history  = document.getElementById('history');

    function flip() {
      if (busy) return;
      busy = true;
      flipBtn.disabled = true;
      resultEl.classList.remove('visible');

      const isHeads = Math.random() < 0.5;

      // spin 4–6 full rotations, then land on the chosen face
      const extraSpins = (Math.floor(Math.random() * 3) + 4) * 360;
      const targetMod  = isHeads ? 0 : 180;
      const currentMod = ((rotation % 360) + 360) % 360;
      const diff       = ((targetMod - currentMod) + 360) % 360;
      rotation        += extraSpins + diff;

      coin.style.transition = 'transform 0.9s cubic-bezier(0.33, 1, 0.68, 1)';
      coin.style.transform  = `rotateY(${rotation}deg)`;

      setTimeout(() => {
        coin.style.transition = '';

        if (isHeads) heads++; else tails++;
        document.getElementById('headsCount').textContent = heads;
        document.getElementById('flipsCount').textContent = heads + tails;
        document.getElementById('tailsCount').textContent = tails;

        resultEl.textContent = isHeads ? 'Heads' : 'Tails';
        resultEl.classList.add('visible');
        addPill(isHeads ? 'H' : 'T');

        busy = false;
        flipBtn.disabled = false;
      }, 950);
    }

    function addPill(face) {
      if (history.children.length >= 20) history.removeChild(history.firstChild);
      const p = document.createElement('div');
      p.className = `pill pill-${face}`;
      p.textContent = face;
      history.appendChild(p);
    }

    function reset() {
      heads = tails = rotation = 0;
      coin.style.transition = 'transform 0.4s ease';
      coin.style.transform  = 'rotateY(0deg)';
      setTimeout(() => { coin.style.transition = ''; }, 400);
      document.getElementById('headsCount').textContent = '0';
      document.getElementById('flipsCount').textContent = '0';
      document.getElementById('tailsCount').textContent = '0';
      resultEl.classList.remove('visible');
      history.innerHTML = '';
    }

    flipBtn.addEventListener('click', flip);
    resetBtn.addEventListener('click', reset);
    document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); flip(); } });
  </script>

</body>
</html>
