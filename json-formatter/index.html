<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#eef0f4">
  <title>JSON Formatter</title>
  <style>
    /* One self-contained file — no remote fonts, scripts, styles, or network.
       Every colour goes through a token so dark mode flips for free. Syntax
       colours below are illustrative content (the design system allows other
       hues for charts, game pieces, code tokens); they are still tokenised and
       defined in both schemes. */
    :root {
      color-scheme: light dark;

      --primary: #4d63ff;        /* CTA fill, active states           */
      --primary-text: #3b50e0;   /* azure as TEXT (eyebrow, links)    */
      --primary-active: #6f82ff; /* hover / pressed fill              */
      --primary-pale: #e6ebff;   /* soft tint, badge + focus ring     */
      --on-primary: #ffffff;     /* label sitting on --primary        */

      --ink: #111318;            /* headings, highest-emphasis text   */
      --body: #454852;           /* secondary body text               */
      --mute: #868a93;           /* captions, placeholder, fine print */

      --canvas: #ffffff;         /* card surface                      */
      --canvas-soft: #eef0f4;    /* page background                   */
      --line: #dfe3ec;           /* hairline borders + dividers       */

      --positive: #22a559;       /* valid indicator                   */
      --positive-deep: #0c5230;  /* valid text                        */
      --positive-pale: #e2f5ea;  /* valid surface tint                */
      --negative: #e0453f;       /* error indicator                   */
      --negative-deep: #b02a2a;  /* error text                        */
      --negative-pale: #fbe3e2;  /* error surface tint                */

      /* JSON syntax tokens (illustrative) */
      --tok-key: #3b50e0;        /* object keys        */
      --tok-str: #0c7d63;        /* string values      */
      --tok-num: #b45309;        /* numbers            */
      --tok-bool: #7c3aed;       /* true / false       */
      --tok-null: #868a93;       /* null               */
      --tok-punct: #868a93;      /* keys' colon        */

      --display: "Manrope", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", "SFMono-Regular", "Menlo", "Consolas", "Liberation Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #8b9bff;
        --primary-text: #8b9bff;
        --primary-active: #a8b4ff;
        --primary-pale: #232842;
        --on-primary: #111318;

        --ink: #eceff5;
        --body: #a9b0bf;
        --mute: #7d8494;

        --canvas: #20242e;
        --canvas-soft: #14161b;
        --line: #2f333d;

        --positive: #3ddc84;
        --positive-deep: #86efac;
        --positive-pale: #14301f;
        --negative: #ff6b63;
        --negative-deep: #ff9490;
        --negative-pale: #3a1412;

        --tok-key: #8b9bff;
        --tok-str: #4ade80;
        --tok-num: #fbbf24;
        --tok-bool: #c4b5fd;
        --tok-null: #7d8494;
        --tok-punct: #7d8494;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      font-feature-settings: "calt";
      background: var(--canvas-soft);
      color: var(--ink);
      min-height: 100dvh;
      padding: 24px 20px 40px;
    }

    .wrap { max-width: 1080px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 22px; }
    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--primary-text);
      margin-bottom: 6px;
    }
    h1 {
      font-family: var(--display);
      font-size: clamp(1.9rem, 6vw, 2.6rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--ink);
    }
    p.sub { color: var(--body); margin: 8px auto 0; max-width: 48ch; }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin: 22px 0 16px;
    }
    button, select, label.field {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s, border-color 0.15s;
    }
    button {
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      padding: 11px 22px;
    }
    button:hover { background: var(--primary-active); transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    button.ghost {
      background: var(--canvas);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    button.ghost:hover { background: var(--canvas-soft); }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--canvas);
      color: var(--body);
      border: 1px solid var(--line);
      padding: 7px 14px 7px 16px;
      border-radius: 24px;
      font-weight: 500;
      font-size: 0.85rem;
    }
    .field select {
      border: none;
      background: transparent;
      color: var(--ink);
      font-weight: 600;
      padding: 2px 4px;
      border-radius: 8px;
    }
    .field select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .field.toggle { cursor: pointer; user-select: none; }
    .field.toggle input { accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; }

    /* Panels */
    .panes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 760px) { .panes { grid-template-columns: 1fr; } }

    .pane {
      background: var(--canvas);
      border-radius: 24px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-height: 340px;
    }
    .pane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      min-height: 24px;
    }
    .pane-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .copy-btn {
      background: transparent;
      color: var(--primary-text);
      border: none;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 8px;
    }
    .copy-btn:hover { background: var(--primary-pale); transform: none; }

    textarea {
      flex: 1;
      width: 100%;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--canvas-soft);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.9rem;
      line-height: 1.55;
      padding: 14px 16px;
      tab-size: 2;
    }
    textarea::placeholder { color: var(--mute); }
    textarea:focus-visible {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-pale);
    }

    .output {
      flex: 1;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--canvas-soft);
      padding: 14px 16px;
      margin: 0;
      font-family: var(--mono);
      font-size: 0.9rem;
      line-height: 1.55;
      white-space: pre;
      color: var(--ink);
    }
    .output .placeholder { color: var(--mute); white-space: normal; }

    .tok-key { color: var(--tok-key); }
    .tok-str { color: var(--tok-str); }
    .tok-num { color: var(--tok-num); }
    .tok-bool { color: var(--tok-bool); font-weight: 600; }
    .tok-null { color: var(--tok-null); font-style: italic; }
    .tok-punct { color: var(--tok-punct); }

    /* Status bar */
    .status {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      margin-top: 16px;
      padding: 12px 18px;
      border-radius: 16px;
      background: var(--canvas);
      border: 1px solid var(--line);
      font-size: 0.88rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      white-space: nowrap;
    }
    .badge .dot { width: 8px; height: 8px; border-radius: 50%; }
    .badge.ok { background: var(--positive-pale); color: var(--positive-deep); }
    .badge.ok .dot { background: var(--positive); }
    .badge.bad { background: var(--negative-pale); color: var(--negative-deep); }
    .badge.bad .dot { background: var(--negative); }
    .badge.idle { background: var(--canvas-soft); color: var(--mute); }
    .badge.idle .dot { background: var(--mute); }

    .status-msg { color: var(--body); flex: 1; min-width: 160px; }
    .status-msg.error { color: var(--negative-deep); font-weight: 500; }

    .stats { display: flex; gap: 16px; flex-wrap: wrap; color: var(--mute); }
    .stats b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(12px);
      background: var(--ink);
      color: var(--canvas);
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Developer &middot; Formatting</div>
      <h1>JSON Formatter</h1>
      <p class="sub">Paste JSON to beautify, minify, or validate it — with pinpoint error locations. Everything runs locally and offline.</p>
    </header>

    <div class="toolbar">
      <button id="format">Beautify</button>
      <button id="minify" class="ghost">Minify</button>
      <label class="field">Indent
        <select id="indent">
          <option value="2">2 spaces</option>
          <option value="4">4 spaces</option>
          <option value="tab">Tab</option>
        </select>
      </label>
      <label class="field toggle"><input type="checkbox" id="sort"> Sort keys</label>
      <button id="sample" class="ghost">Sample</button>
      <button id="clear" class="ghost">Clear</button>
    </div>

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <span class="pane-title">Input</span>
          <button class="copy-btn" id="copyIn">Copy</button>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
          placeholder='{ "hello": "world", "items": [1, 2, 3] }'></textarea>
      </div>
      <div class="pane">
        <div class="pane-head">
          <span class="pane-title">Output</span>
          <button class="copy-btn" id="copyOut">Copy</button>
        </div>
        <pre class="output" id="output"><span class="placeholder">Formatted JSON appears here.</span></pre>
      </div>
    </div>

    <div class="status">
      <span class="badge idle" id="badge"><span class="dot"></span><span id="badgeText">Waiting</span></span>
      <span class="status-msg" id="msg">Type or paste JSON, then hit Beautify.</span>
      <span class="stats">
        <span>Lines <b id="stLines">0</b></span>
        <span>Chars <b id="stChars">0</b></span>
        <span>Depth <b id="stDepth">0</b></span>
        <span>Keys <b id="stKeys">0</b></span>
      </span>
    </div>
  </div>

  <div class="toast" id="toast">Copied</div>

  <script>
    'use strict';
    const PLACEHOLDER = 'Formatted JSON appears here.';

    const $ = (id) => document.getElementById(id);
    const input = $('input'), output = $('output');
    const badge = $('badge'), badgeText = $('badgeText'), msg = $('msg');
    const stLines = $('stLines'), stChars = $('stChars'), stDepth = $('stDepth'), stKeys = $('stKeys');

    // ── helpers ────────────────────────────────────────────────────────────
    function escapeHtml(s) {
      return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    }

    // Colourise well-formed JSON that we generated ourselves via JSON.stringify.
    function highlight(json) {
      const re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false)\b|\b(null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
      let out = '', last = 0, m;
      while ((m = re.exec(json))) {
        out += escapeHtml(json.slice(last, m.index));
        if (m[1] !== undefined) {
          const cls = m[2] ? 'tok-key' : 'tok-str';
          out += '<span class="' + cls + '">' + escapeHtml(m[1]) + '</span>';
          if (m[2]) out += '<span class="tok-punct">' + escapeHtml(m[2]) + '</span>';
        } else if (m[3] !== undefined) {
          out += '<span class="tok-bool">' + m[3] + '</span>';
        } else if (m[4] !== undefined) {
          out += '<span class="tok-null">' + m[4] + '</span>';
        } else {
          out += '<span class="tok-num">' + m[5] + '</span>';
        }
        last = re.lastIndex;
      }
      out += escapeHtml(json.slice(last));
      return out;
    }

    // Recursively sort object keys for a stable, diffable output.
    function sortKeys(value) {
      if (Array.isArray(value)) return value.map(sortKeys);
      if (value && typeof value === 'object') {
        return Object.keys(value).sort().reduce((acc, k) => {
          acc[k] = sortKeys(value[k]);
          return acc;
        }, {});
      }
      return value;
    }

    // Depth + key count for the stats row.
    function inspect(value) {
      let keys = 0, depth = 0;
      (function walk(v, d) {
        if (d > depth) depth = d;
        if (Array.isArray(v)) {
          for (const item of v) walk(item, d + 1);
        } else if (v && typeof v === 'object') {
          for (const k of Object.keys(v)) { keys++; walk(v[k], d + 1); }
        }
      })(value, 0);
      return { keys, depth };
    }

    // Turn a JSON.parse error into a line/column when the engine reports a position.
    function locate(text, error) {
      const raw = String((error && error.message) || error);
      const clean = raw.replace(/^JSON\.parse:\s*/, '');
      // If the engine already spells out line/column, keep its message as-is.
      if (/line\s+\d+\s+column\s+\d+/i.test(raw)) return clean;

      let pos = null;
      let mm = raw.match(/position\s+(\d+)/i);
      if (mm) pos = Number(mm[1]);
      else { mm = raw.match(/char\s+(\d+)/i); if (mm) pos = Number(mm[1]); }

      if (pos !== null && pos >= 0 && pos <= text.length) {
        const upto = text.slice(0, pos);
        const line = upto.split('\n').length;
        const col = pos - upto.lastIndexOf('\n');
        return clean + ' — at line ' + line + ', column ' + col;
      }
      return clean;
    }

    function setStatus(state, message, isError) {
      badge.className = 'badge ' + state;
      badgeText.textContent = state === 'ok' ? 'Valid JSON' : state === 'bad' ? 'Invalid JSON' : 'Waiting';
      msg.textContent = message;
      msg.className = 'status-msg' + (isError ? ' error' : '');
    }

    function setStats(value) {
      stChars.textContent = (input.value || '').length;
      if (value === undefined) {
        stLines.textContent = 0; stDepth.textContent = 0; stKeys.textContent = 0;
        return;
      }
      const pretty = JSON.stringify(value, null, 2);
      stLines.textContent = pretty.split('\n').length;
      const info = inspect(value);
      stDepth.textContent = info.depth;
      stKeys.textContent = info.keys;
    }

    function indentValue() {
      const v = $('indent').value;
      return v === 'tab' ? '\t' : Number(v);
    }

    function showPlaceholder(text) {
      output.innerHTML = '<span class="placeholder">' + escapeHtml(text) + '</span>';
    }

    // ── core actions ───────────────────────────────────────────────────────
    function parse() {
      const text = input.value;
      if (!text.trim()) {
        setStatus('idle', 'Type or paste JSON, then hit Beautify.', false);
        setStats(undefined);
        return { ok: false, empty: true };
      }
      try {
        let value = JSON.parse(text);
        if ($('sort').checked) value = sortKeys(value);
        setStatus('ok', 'Parsed successfully.', false);
        setStats(value);
        return { ok: true, value };
      } catch (e) {
        setStatus('bad', locate(text, e), true);
        setStats(undefined);
        return { ok: false };
      }
    }

    function render(spacer) {
      const res = parse();
      if (!res.ok) {
        showPlaceholder(res.empty ? PLACEHOLDER : 'Fix the error to see formatted output.');
        return;
      }
      output.innerHTML = highlight(JSON.stringify(res.value, null, spacer));
    }

    $('format').onclick = () => render(indentValue());
    $('minify').onclick = () => render(0);
    $('sort').onchange = () => { if (input.value.trim()) render(indentValue()); else parse(); };
    $('indent').onchange = () => { if (input.value.trim()) render(indentValue()); };

    $('clear').onclick = () => {
      input.value = '';
      showPlaceholder(PLACEHOLDER);
      setStatus('idle', 'Type or paste JSON, then hit Beautify.', false);
      setStats(undefined);
      input.focus();
    };

    $('sample').onclick = () => {
      input.value = JSON.stringify({
        name: "Hillnote",
        type: "knowledge workspace",
        offline: true,
        version: 2.4,
        tags: ["markdown", "notes", "tools"],
        author: { handle: "hillnote", verified: true, since: 2024 },
        features: [
          { id: 1, label: "Capture", enabled: true },
          { id: 2, label: "Sync", enabled: false, note: null }
        ]
      });
      render(indentValue());
    };

    // Live validation as you type (debounced) — output only re-renders on action.
    let t;
    input.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(parse, 200);
    });

    // ── copy ───────────────────────────────────────────────────────────────
    const toast = $('toast');
    function flash(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(flash._t);
      flash._t = setTimeout(() => toast.classList.remove('show'), 1400);
    }
    function copyText(text, label) {
      if (!text) { flash('Nothing to copy'); return; }
      const done = () => flash(label + ' copied');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, () => legacyCopy(text, done));
      } else {
        legacyCopy(text, done);
      }
    }
    function legacyCopy(text, done) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { flash('Copy failed'); }
      document.body.removeChild(ta);
    }
    $('copyIn').onclick = () => copyText(input.value, 'Input');
    $('copyOut').onclick = () => {
      const text = output.querySelector('.placeholder') ? '' : output.textContent;
      copyText(text, 'Output');
    };
  </script>
</body>
</html>
