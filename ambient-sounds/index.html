<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Ambient Sounds</title>
  <style>
    :root {
      --bg: #000;
      --surface: #0d0d0d;
      --border: #1a1a1a;
      --text: #f0f0f0;
      --muted: #666;
      --accent: #0891b2;
      --accent-dim: rgba(8,145,178,0.12);
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 32px 24px;
    }

    h1 {
      font-size: clamp(0.9rem, 3.5vw, 1.1rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Waveform bars ── */
    .visualizer {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 52px;
    }

    .bar {
      width: 4px;
      height: 4px;
      border-radius: 2px;
      background: var(--accent);
      opacity: 0.2;
      transition: opacity 0.5s;
    }

    .visualizer.playing .bar { opacity: 1; }

    .visualizer.playing .bar:nth-child(1)  { animation: wave 1.1s ease-in-out infinite 0.00s; }
    .visualizer.playing .bar:nth-child(2)  { animation: wave 1.3s ease-in-out infinite 0.12s; }
    .visualizer.playing .bar:nth-child(3)  { animation: wave 1.0s ease-in-out infinite 0.24s; }
    .visualizer.playing .bar:nth-child(4)  { animation: wave 1.4s ease-in-out infinite 0.10s; }
    .visualizer.playing .bar:nth-child(5)  { animation: wave 0.9s ease-in-out infinite 0.20s; }
    .visualizer.playing .bar:nth-child(6)  { animation: wave 1.2s ease-in-out infinite 0.05s; }
    .visualizer.playing .bar:nth-child(7)  { animation: wave 1.0s ease-in-out infinite 0.30s; }
    .visualizer.playing .bar:nth-child(8)  { animation: wave 1.3s ease-in-out infinite 0.15s; }
    .visualizer.playing .bar:nth-child(9)  { animation: wave 1.1s ease-in-out infinite 0.22s; }
    .visualizer.playing .bar:nth-child(10) { animation: wave 1.4s ease-in-out infinite 0.08s; }
    .visualizer.playing .bar:nth-child(11) { animation: wave 0.9s ease-in-out infinite 0.18s; }

    @keyframes wave {
      0%, 100% { height: 5px; }
      50%       { height: 44px; }
    }

    /* ── Sound cards ── */
    .sound-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }

    .sound-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 16px 8px 12px;
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.1s;
      user-select: none;
    }

    .sound-card:hover { border-color: var(--accent); }

    .sound-card.active {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .sound-card:active { transform: scale(0.95); }

    .sound-emoji { font-size: 1.6rem; }

    .sound-name {
      font-size: 0.58rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    .sound-card.active .sound-name { color: var(--text); }

    /* ── Volume ── */
    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 300px;
    }

    .vol-icon {
      font-size: 0.95rem;
      width: 22px;
      text-align: center;
      user-select: none;
    }

    input[type="range"] {
      -webkit-appearance: none;
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 10px rgba(8,145,178,0.5);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
    }

    /* ── Play / Pause button ── */
    .play-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, box-shadow 0.2s, transform 0.12s;
    }

    .play-btn svg {
      width: 24px;
      height: 24px;
      fill: var(--accent);
      transition: opacity 0.15s;
    }

    .play-btn:hover {
      background: rgba(8,145,178,0.25);
      box-shadow: 0 0 28px rgba(8,145,178,0.3);
    }

    .play-btn:active { transform: scale(0.94); }

    .play-btn.playing {
      box-shadow: 0 0 36px rgba(8,145,178,0.22);
    }

    /* ── Timer ── */
    .timer {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      min-height: 1.1em;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>

  <h1>Ambient Sounds</h1>

  <div class="visualizer" id="visualizer">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div>
  </div>

  <div class="sound-grid" id="soundGrid"></div>

  <div class="volume-wrap">
    <span class="vol-icon">🔈</span>
    <input type="range" id="volume" min="0" max="100" value="65" aria-label="Volume" />
    <span class="vol-icon">🔊</span>
  </div>

  <button class="play-btn" id="playBtn" aria-label="Play">
    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <div class="timer" id="timer"></div>

  <script>
    const SOUNDS = [
      { id: 'rain',   label: 'Rain',   emoji: '🌧️' },
      { id: 'ocean',  label: 'Ocean',  emoji: '🌊' },
      { id: 'cafe',   label: 'Cafe',   emoji: '☕' },
      { id: 'forest', label: 'Forest', emoji: '🌿' },
      { id: 'white',  label: 'White',  emoji: '〰️' },
    ];

    // ── Persist preferences
    const STORE_KEY = 'ambientSoundsPrefs';
    let prefs = (() => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } })();
    let selectedId = prefs.sound  || 'rain';
    let volume     = prefs.volume !== undefined ? prefs.volume : 65;

    // ── Runtime state
    let isPlaying    = false;
    let birdsActive  = false;
    let audioCtx     = null;
    let masterGain   = null;
    let activeNodes  = [];
    let sessionStart = null;
    let timerInterval = null;

    // ── DOM
    const playBtn    = document.getElementById('playBtn');
    const playIcon   = document.getElementById('playIcon');
    const visualizer = document.getElementById('visualizer');
    const volSlider  = document.getElementById('volume');
    const soundGrid  = document.getElementById('soundGrid');
    const timerEl    = document.getElementById('timer');
    volSlider.value  = volume;

    // ── Build sound cards
    SOUNDS.forEach(s => {
      const card = document.createElement('div');
      card.className = 'sound-card' + (s.id === selectedId ? ' active' : '');
      card.dataset.id = s.id;
      card.innerHTML = `<span class="sound-emoji">${s.emoji}</span><span class="sound-name">${s.label}</span>`;
      card.addEventListener('click', () => selectSound(s.id));
      soundGrid.appendChild(card);
    });

    function selectSound(id) {
      selectedId = id;
      prefs.sound = id;
      save();
      soundGrid.querySelectorAll('.sound-card').forEach(c => {
        c.classList.toggle('active', c.dataset.id === id);
      });
      if (isPlaying) { stopNodes(); buildSound(); }
    }

    function save() {
      localStorage.setItem(STORE_KEY, JSON.stringify(prefs));
    }

    // ── Audio helpers
    function initCtx() {
      if (!audioCtx) {
        audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function noiseBuffer() {
      const rate = audioCtx.sampleRate;
      const buf  = audioCtx.createBuffer(1, rate * 4, rate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.loop   = true;
      return src;
    }

    function filteredNoise(type, freq, Q, gain) {
      const src = noiseBuffer();
      const f   = audioCtx.createBiquadFilter();
      f.type = type; f.frequency.value = freq;
      if (Q !== undefined) f.Q.value = Q;
      const g = audioCtx.createGain();
      g.gain.value = gain;
      src.connect(f); f.connect(g); g.connect(masterGain);
      src.start();
      activeNodes.push(src);
    }

    const soundBuilders = {
      rain() {
        filteredNoise('bandpass', 3500, 0.28, 1.3);
        filteredNoise('highpass', 8000, undefined, 0.2);
        filteredNoise('lowpass',  550,  undefined, 0.4);
      },
      ocean() {
        filteredNoise('lowpass', 480, undefined, 0.75);
        // Wave swell: bandpass noise modulated by a slow LFO
        const src = noiseBuffer();
        const bpf = audioCtx.createBiquadFilter();
        bpf.type = 'bandpass'; bpf.frequency.value = 850; bpf.Q.value = 0.45;
        const gNode = audioCtx.createGain();
        gNode.gain.value = 0.55;
        const lfo   = audioCtx.createOscillator();
        lfo.type = 'sine'; lfo.frequency.value = 0.18;
        const lfoG  = audioCtx.createGain();
        lfoG.gain.value = 0.42;
        src.connect(bpf); bpf.connect(gNode); gNode.connect(masterGain);
        lfo.connect(lfoG); lfoG.connect(gNode.gain);
        src.start(); lfo.start();
        activeNodes.push(src, lfo);
      },
      cafe() {
        filteredNoise('bandpass', 360,  1.8, 0.52);
        filteredNoise('bandpass', 750,  2.5, 0.18);
        filteredNoise('highpass', 5200, undefined, 0.06);
      },
      forest() {
        filteredNoise('bandpass', 650, 0.55, 0.48);
        filteredNoise('highpass', 5800, undefined, 0.07);
        birdsActive = true;
        scheduleBird();
      },
      white() {
        filteredNoise('lowpass', 18000, undefined, 0.88);
      },
    };

    function scheduleBird() {
      if (!birdsActive) return;
      const t    = audioCtx.currentTime;
      const freq = 2200 + Math.random() * 2800;
      const dur  = 0.06 + Math.random() * 0.14;
      const osc  = audioCtx.createOscillator();
      const env  = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.linearRampToValueAtTime(freq * (1.2 + Math.random() * 0.2), t + dur * 0.4);
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(0.1 + Math.random() * 0.08, t + 0.015);
      env.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(env); env.connect(masterGain);
      osc.start(t); osc.stop(t + dur + 0.05);
      setTimeout(scheduleBird, (1.2 + Math.random() * 5) * 1000);
    }

    function buildSound() {
      const builder = soundBuilders[selectedId];
      if (builder) builder();
    }

    function stopNodes() {
      birdsActive = false;
      activeNodes.forEach(n => { try { n.stop(); } catch {} });
      activeNodes = [];
    }

    // ── Timer display
    function formatTime(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      return `${m}:${String(s).padStart(2,'0')}`;
    }

    function startTimer() {
      sessionStart  = Date.now();
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - sessionStart) / 1000);
        timerEl.textContent = formatTime(elapsed);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerEl.textContent = '';
    }

    // ── Toggle play / pause
    function toggle() {
      if (isPlaying) {
        // Fade out then stop
        masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.25);
        setTimeout(() => { stopNodes(); }, 600);
        isPlaying = false;
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        playBtn.classList.remove('playing');
        visualizer.classList.remove('playing');
        stopTimer();
      } else {
        initCtx();
        isPlaying = true;
        buildSound();
        masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
        masterGain.gain.setTargetAtTime(volume / 100, audioCtx.currentTime, 0.5);
        // Pause icon (two rectangles)
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        playBtn.classList.add('playing');
        visualizer.classList.add('playing');
        startTimer();
      }
    }

    volSlider.addEventListener('input', () => {
      volume     = Number(volSlider.value);
      prefs.volume = volume;
      save();
      if (masterGain && isPlaying) {
        masterGain.gain.setTargetAtTime(volume / 100, audioCtx.currentTime, 0.05);
      }
    });

    playBtn.addEventListener('click', toggle);

    // Spacebar shortcut
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        toggle();
      }
    });
  </script>
</body>
</html>
